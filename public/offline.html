<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <!--
      Deliberately a plain static file with no branding lookup and no
      JavaScript. It is shown precisely when the server cannot be reached, so
      anything it needed to fetch would fail too. Styled inline to match the
      app closely enough that it reads as the same product.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --ground: #fafaf8;
        --surface: #ffffff;
        --ink: #141311;
        --ink-muted: #5f5b53;
        --rule: #e5e2db;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #141311;
          --surface: #1d1b18;
          --ink: #f2efe9;
          --ink-muted: #a8a299;
          --rule: #2e2b26;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--ground);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
      }
      .glyph {
        width: 3.25rem;
        height: 3.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: var(--surface);
        border: 1px solid var(--rule);
      }
      h1 { margin: 0; font-size: 1.15rem; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 0.925rem; color: var(--ink-muted); }
      button {
        margin-top: 0.25rem;
        min-height: 2.5rem;
        padding: 0 1.1rem;
        border-radius: 0.5rem;
        border: 1px solid var(--rule);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { filter: brightness(0.97); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glyph" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M2 2l20 20" />
          <path d="M8.5 16.4a5 5 0 0 1 7 0" />
          <path d="M5 12.9a10 10 0 0 1 3.2-2.1" />
          <path d="M15.8 10.8A10 10 0 0 1 19 12.9" />
          <path d="M2 8.8a15 15 0 0 1 4.6-2.7" />
          <path d="M12 5c2.6 0 5.1.7 7.2 2a15 15 0 0 1 2.8 1.8" />
          <path d="M12 20h.01" />
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <p>
        This page needs a connection. Your timetable, results and messages will load again as soon
        as you&rsquo;re back on mobile data or Wi-Fi.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
